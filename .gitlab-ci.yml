image: node:22.17.1

stages:
  - lint
  - build
  - test

default:
  tags:
    - openbravo-group-runner
# -----------------------------
# LINT: ESLint + Prettier
# -----------------------------
lint:
  stage: lint
  variables:
    NODE_ENV: development
  before_script:
    - '[ -d node_modules ] || npm ci --client'
  script:
    - npm run lint
  rules:
    - if: '$CI_MERGE_REQUEST_ID || $CI_COMMIT_BRANCH =~ /^(main|master)$/'

# -----------------------------
# BUILD: tsc + Vite build
# -----------------------------
build:
  stage: build
  needs: [lint]
  variables:
    NODE_ENV: development
  before_script:
    - '[ -d node_modules ] || npm ci --client'
  script:
    - npm run build
  rules:
    - if: '$CI_MERGE_REQUEST_ID || $CI_COMMIT_BRANCH =~ /^(main|master)$/'

# -----------------------------
# SECURITY: SAST + Secret Detection
# -----------------------------

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  ROLLUP_DISABLE_NATIVE: 'true'
