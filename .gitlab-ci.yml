image: node:22.17.1

stages:
  - lint
  - build
  - test
  - secret-detection

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
  policy: pull-push

before_script:
  - node -v
  - npm -v
  - '[ -d node_modules ] || npm ci'

# -----------------------------
# LINT: ESLint + Prettier
# -----------------------------
lint:
  stage: lint
  script:
    - npm run lint
  artifacts:
    when: always
  allow_failure: false
  only:
    - merge_requests
    - main
    - master

# -----------------------------
# BUILD: tsc + Vite build
# -----------------------------
build:
  stage: build
  script:
    - npm run build
  artifacts:
    paths:
      - dist
    expire_in: 1 week
  only:
    - merge_requests
    - main
    - master

# -----------------------------
# SECURITY: SAST + Secret Detection
# -----------------------------

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SECRET_DETECTION_ENABLED: 'true'
  ROLLUP_DISABLE_NATIVE: 'true'

sast:
  stage: test
  needs:
    - job: build
      optional: true
  before_script: []

secret_detection:
  stage: secret-detection
  before_script: []
