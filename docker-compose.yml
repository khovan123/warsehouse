services:
  apis:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: warehouse-api-dotnet
    ports:
      - "8081:8081"
    environment:
      ASPNETCORE_URLS: "http://0.0.0.0:8081"
      HTTP_PORTS: "8081"
      HTTPS_PORTS: "8082"
      PORT: "8081"
    volumes:
      - keys:/var/keys
    restart: unless-stopped

volumes:
  keys:
